<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillMap</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">

<div class="flex min-h-screen max-w-[1180px] mx-auto">

  <!-- SIDEBAR -->
  <aside class="sidebar w-56 shrink-0 px-5 py-6 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 px-1 mb-10">
        <div class="logo-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 3.4 3.8 10.2c-.8.3-.7 1.4.1 1.6l6.6 1.7 1.7 6.6c.2.8 1.3.9 1.6.1l6.8-16.8z"/></svg>
        </div>
        <span class="text-base font-medium text-gray-800 tracking-tight">SKILLMAP</span>
      </div>
      <nav class="flex flex-col gap-2">
        <div class="nav-item disabled" title="Próximamente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
          Objetivo
        </div>
        <button type="button" class="nav-item active" data-view="dashboard" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
          Mi Ruta
        </button>
        <button type="button" class="nav-item" data-view="mapa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>
          Mapa Visual
        </button>
        <div class="nav-item disabled" title="Próximamente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/><path d="M8 12v-1.5M10.5 12V8.5M13 12v-2.5"/></svg>
          Analizador
        </div>
        <div class="nav-item disabled" title="Próximamente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4"/><path d="M4 20.5c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5z"/></svg>
          Perfil
        </div>
      </nav>
    </div>
    <p class="text-[10px] text-gray-300 px-2">v0.1 · conectado a la API</p>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 min-w-0 px-5 py-8 md:px-10 md:py-10">
    <section id="view-dashboard">
      <header class="flex flex-wrap items-start justify-between gap-4 mb-8">
        <div>
          <label for="goal-selector" class="ruta-eyebrow">Objetivo actual</label>
          <div class="relative inline-flex items-center mt-2">
            <select id="goal-selector" disabled class="goal-select">
              <option>Cargando…</option>
            </select>
            <svg class="pointer-events-none absolute right-0 text-gray-400" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <!-- Lo llena js/dashboard.js con la demanda promedio de las brechas del objetivo -->
        <div id="market-demand" class="market-demand" hidden></div>
      </header>

      <div id="app-content">
        <p class="text-sm text-gray-400">Cargando habilidades desde la API…</p>
      </div>
    </section>

    <section id="view-mapa" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <div>
          <p class="text-[11px] text-gray-400 mb-0.5">VISTA</p>
          <h1 class="text-xl font-semibold text-gray-800">Mapa Visual</h1>
          <p class="text-xs text-gray-400 mt-0.5">Todas las habilidades del sistema, sin importar el objetivo activo.</p>
        </div>
      </div>

      <!-- Lo llena js/mapa.js la primera vez que se abre la vista -->
      <div id="mapa-content"></div>
    </section>
  </main>
</div>

<script src="js/skill-card.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/mapa.js"></script>
</body>
</html>
