<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillMap</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">

<div class="flex min-h-screen max-w-[1180px] mx-auto">

  <!-- SIDEBAR -->
  <aside class="w-56 shrink-0 bg-white border-r border-gray-100 p-4 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-2 px-2 mb-6">
        <div class="w-7 h-7 rounded-md flex items-center justify-center text-white text-xs font-bold" style="background:#D95F8E;">S</div>
        <span class="font-semibold text-gray-800 text-sm tracking-tight">SKILLMAP</span>
      </div>
      <nav class="flex flex-col gap-1">
        <div class="nav-item disabled" title="Próximamente">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
          Objetivo
        </div>
        <div class="nav-item active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h4l10-10-4-4L4 15v4z"/></svg>
          Mi Ruta
        </div>
        <div class="nav-item disabled" title="Próximamente">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="10" r="2.4"/><circle cx="9" cy="18" r="2.4"/></svg>
          Mapa Visual
        </div>
        <div class="nav-item disabled" title="Próximamente">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
          Analizador
        </div>
        <div class="nav-item disabled" title="Próximamente">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.4-3.8 4-5.6 7-5.6s5.6 1.8 7 5.6"/></svg>
          Perfil
        </div>
      </nav>
    </div>
    <p class="text-[10px] text-gray-300 px-2">v0.1 · conectado a la API</p>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <label for="goal-selector" class="block text-[11px] text-gray-400 mb-0.5">OBJETIVO ACTUAL</label>
        <div class="relative inline-flex items-center">
          <select id="goal-selector" disabled
            class="appearance-none bg-transparent border-0 p-0 pr-6 text-xl font-semibold text-gray-800 cursor-pointer focus:outline-none focus-visible:underline disabled:cursor-wait">
            <option>Cargando…</option>
          </select>
          <svg class="pointer-events-none absolute right-0 text-gray-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <span class="text-xs font-medium px-3 py-1 rounded-full" style="background:#EAFBF3; color:#1f7a54;">● Alta Demanda</span>
    </div>

    <div id="app-content" class="grid md:grid-cols-2 gap-5">
      <p class="text-sm text-gray-400 col-span-2">Cargando habilidades desde la API…</p>
    </div>
  </main>
</div>

<script src="js/skill-card.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
